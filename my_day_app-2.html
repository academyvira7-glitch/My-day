<style>

:root{--bg:#f3f8fa;--card:#ffffff;--ink:#10262b;--mut:#5a727a;--line:#dfeaee;--soft:#edf4f6;--pri:#0b8c7f;--pris:#dcf4f0;--onpri:#ffffff;--hero1:#0b8c7f;--hero2:#0a6f8f;--r1:#ef4444;--r2:#f97316;--r3:#f5a524;--r4:#84cc16;--r5:#10b981;--blue:#3b82f6;--violet:#8b5cf6;--rose:#ec4899;--shadow:0 6px 20px rgba(16,38,43,.07);--font:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif}

:root[data-theme="dark"]{--bg:#0a171b;--card:#10242a;--ink:#e8f3f5;--mut:#93abb3;--line:#1d3a42;--soft:#0c1e23;--pri:#35d3bf;--pris:#12383c;--onpri:#04302b;--hero1:#0f6e68;--hero2:#0d5373;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;min-height:100%;direction:rtl}
body::before{content:"";position:fixed;top:0;left:0;right:0;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
.w{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}

.tabs .w{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:8px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;color:var(--mut);font-size:11px;font-weight:600}

main.w{padding-block:4px 120px}

.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
textarea.in{min-height:48px}
.stack{display:grid;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;background:var(--pri);color:var(--onpri);border-radius:14px;padding:11px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:color-mix(in srgb,var(--r1) 14%,var(--card));color:var(--r1);border:1px solid color-mix(in srgb,var(--r1) 40%,var(--line))}
.btn.arm{background:var(--r1);color:#fff;border-color:var(--r1)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:12px}

.pill.m{background:var(--soft);color:var(--mut)}

.empty b{display:block;color:var(--ink);margin-bottom:4px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}

.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring b{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800}

.hero p{margin:2px 0 0;font-size:13px;opacity:.9}

.mini b{display:block;font-size:17px;line-height:1.4}
.hero .btn{background:rgba(255,255,255,.2);color:#fff;margin-top:12px}
.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--pris);border:1px solid color-mix(in srgb,var(--pri) 35%,var(--line));border-radius:18px;padding:12px 14px;margin-top:12px;font-size:13px}

.rows{display:grid;gap:8px}
.row-b{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}

.row-b .rt{flex:1;min-width:0;font-size:14px}

.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

.blk.dn .bt{text-decoration:line-through;color:var(--mut)}
.blk .bb{flex:1;min-width:0;border:0;background:none;text-align:right;padding:0}
.blk .tm{font-size:12px;color:var(--mut)}
.blk .bt{font-size:14.5px;font-weight:600}
.blk .ck{align-self:center}
.tk{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 4px}

.tk .tt{flex:1;min-width:0;font-size:14px}
.tk.dn .tt{text-decoration:line-through;color:var(--mut)}
.tk.mv .tt{color:var(--mut);font-size:13px}
.addrow{display:flex;gap:8px;margin-top:10px}

.gsum .big{font-size:34px;font-weight:800;line-height:1.2}
.goal{padding:0;overflow:hidden}
.gh{display:block;width:100%;text-align:right;border:0;background:none;padding:14px 16px}
.gh .l1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.gh .gt{font-weight:800;font-size:15.5px}
.gh .l2{display:flex;align-items:center;gap:10px;margin-top:10px}
.gh .l2 .bar{flex:1}
.gh .l2 b{font-size:15px;min-width:42px;text-align:left}
.pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.gb{padding:0 16px 16px;border-top:1px solid var(--line)}
.bd{display:grid;grid-template-columns:96px 1fr 40px;gap:8px;align-items:center;font-size:12.5px;margin-top:10px}
.bd b{text-align:left}
.sub2{font-size:12px;color:var(--mut)}
.gsec{margin-top:16px}
.gsec h4{margin:0 0 8px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.li{display:flex;align-items:center;gap:6px;padding:4px 0}
.li .cb{margin-inline:0 6px}
.li .tt{flex:1;font-size:13.5px}
.li.dn .tt{text-decoration:line-through;color:var(--mut)}
.spark{width:100%;height:84px;margin-top:8px}
/* stats */
.lvl{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border:0}
.lvl .t{display:flex;justify-content:space-between;align-items:center}
.lvl h3{margin:0;font-size:24px;font-weight:800}
.lvl small{opacity:.85}
.lvl .bar{background:rgba(255,255,255,.25);margin-top:14px}.lvl .bar i{background:#fff}

.wk i{display:block;width:100%;max-width:28px;border-radius:8px 8px 4px 4px;background:var(--c);min-height:4px}
.wk b{font-size:11px;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;justify-items:center}
.cal .h{font-size:12px;color:var(--mut);padding:4px 0}

.bg{text-align:center;font-size:11px;color:var(--mut);line-height:1.5}
.bg .c{width:52px;height:52px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--soft);color:var(--mut);opacity:.6}

.bg.on{color:var(--ink);font-weight:600}
/* sheet + toast */
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:60;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet .bk{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;background:rgba(5,15,18,.55)}
.sheet .pn{position:relative;width:100%;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.pn h3{margin:0 0 4px;font-size:17px;font-weight:800}
.pn .ft{display:flex;gap:10px;margin-top:18px}
.pn .ft .btn:first-child{flex:1}

.toast[hidden]{display:none}
.sr{display:flex;gap:8px;align-items:center;margin-top:8px}
.sr .in{flex:1;min-width:0}
.sr .em{width:56px;flex:none;text-align:center;padding-inline:4px}
@media (prefers-reduced-motion:no-preference){.bar i,.wk i{transition:width .3s,height .3s}}
</style>

function goalCard(g){

  else if(p.pct>=el+5)pill='<span class="pill g">جلوتر از برنامه</span>';
  else if(p.pct>=el-10)pill='<span class="pill">در مسیر</span>';
  else pill='<span class="pill o">عقب‌تر از برنامه</span>';
  const lab={metric:'معیار موفقیت',actions:'اقدام‌های اصلی',effort:'تلاش‌ها'};
  let body='';
  if(open){
    const m=g.metric,e=g.effort;
    body=`<div class="gb">
    <div class="sub2" style="margin-top:12px">پیشرفت کل ${fa(p.pct)}٪ در برابر ${fa(el)}٪ گذشته از سال. خط تیره روی نوار، سهم زمان سال است.</div>
    ${p.comps.map(c=>`<div class="bd num"><span>${lab[c.k]}</span><div class="bar sm"><i style="width:${Math.round(c.p*100)}%"></i></div><b>${fa(Math.round(c.p*100))}٪</b></div><div class="sub2" style="text-align:left;margin-top:-4px">وزن ${fa(c.ew)}٪ از نمره هدف</div>`).join('')||'<div class="sub2" style="margin-top:10px">برای محاسبه‌ی پیشرفت، معیار، اقدام یا تلاش اضافه کن.</div>'}
    ${m?`<div class="gsec"><h4><span>معیار: ${esc(m.name)}</span><span class="num sub2">${fx(num(m.start))} ← ${fx(num(m.cur))} ← ${fx(num(m.target))} ${esc(m.unit)}</span></h4>${spark(m)}
      <div class="sr"><input class="in" id="mv-${g.id}" inputmode="decimal" placeholder="مقدار فعلی (${esc(m.unit)})"><button class="btn sm" data-a="mset" data-id="${g.id}">ثبت</button></div></div>`:''}
    <div class="gsec"><h4><span>اقدام‌های اصلی</span><span class="num sub2">${fa(g.actions.filter(a=>a.done).length)} از ${fa(g.actions.length)}</span></h4>
      ${g.actions.map(a=>`<div class="li ${a.done?'dn':''}"><button class="cb ${a.done?'on':''}" data-a="adone" data-g="${g.id}" data-id="${a.id}" aria-label="انجام شد">${a.done?ic('check',15):''}</button><span class="tt">${esc(a.t)}</span><button class="ib" data-a="adel" data-g="${g.id}" data-id="${a.id}" data-k="1" aria-label="حذف">${ic('trash',17)}</button></div>`).join('')}
      <div class="sr"><input class="in" id="na-${g.id}" placeholder="اقدام تازه..."><button class="btn sm" data-a="aadd" data-id="${g.id}">افزودن</button></div></div>
    ${e?`<div class="gsec"><h4><span>تلاش‌ها (${esc(e.unit)})</span><span class="num sub2">${fx(effortDone(g))} از ${fx(num(e.target))}</span></h4>
      ${(g.habits||[]).length?`<div class="sub2">هر بار انجام ${fa(g.habits.length)} عادت مرتبط ${fx(num(e.per)||1)} ${esc(e.unit)} حساب می‌شود.</div>`:''}
      ${[...g.efforts].reverse().slice(0,3).map(x=>`<div class="li"><span class="tt num">${fx(num(x.v))} ${esc(e.unit)} · ${dateLabel(x.d)}${x.n?' · '+esc(x.n):''}</span><button class="ib" data-a="edel" data-g="${g.id}" data-id="${x.id}" data-k="1" aria-label="حذف">${ic('trash',17)}</button></div>`).join('')}
      <div class="sr"><input class="in" id="ev-${g.id}" inputmode="decimal" placeholder="مقدار" style="max-width:90px;flex:none"><input class="in" id="en-${g.id}" placeholder="توضیح (اختیاری)"><button class="btn sm" data-a="eadd" data-id="${g.id}">ثبت</button></div></div>`:''}
    <div class="addrow" style="margin-top:16px"><button class="btn ghost sm" data-a="gedit" data-id="${g.id}">${ic('edit',16)} ویرایش هدف</button><button class="btn warn sm" data-a="gdel" data-id="${g.id}" data-k="1">${ic('trash',16)} حذف</button></div></div>`;

function effortDone(g){return (goalProg(g,S.days).comps.find(c=>c.k==='effort')||{raw:0}).raw;}
function spark(m){
  const pts=[...(m.log||[]).map(x=>num(x.v))];
  if(pts.length<2)return '<div class="sub2" style="margin-top:6px">با ثبت مقدار فعلی، نمودار پیشرفت اینجا ساخته می‌شود.</div>';
  const lo=Math.min(...pts,num(m.start)),hi=Math.max(...pts,num(m.target)),rg=(hi-lo)||1;
  const xy=pts.map((v,i)=>[10+i*(280/(pts.length-1)),70-((v-lo)/rg)*60]);
  const ln=xy.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 300 80" role="img" aria-label="روند ${esc(m.name)}"><polygon points="10,75 ${ln} ${xy[xy.length-1][0].toFixed(1)},75" fill="var(--pri)" opacity=".14"/><polyline points="${ln}" fill="none" stroke="var(--pri)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${xy.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===xy.length-1?5:3}" fill="var(--pri)"/>`).join('')}</svg>`;
}

function viewStats(){
  const s=ST(),L=s.lvl,hr=habitRates(S.days,S.cfg,TK);
  const wkb=s.wk.map(x=>`<div><b class="num">${fa(x.s)}</b><i style="height:${Math.max(4,x.s*0.8)}px;--c:var(${x.s>=75?'--r5':x.s>=50?'--r4':x.s>=25?'--r2':x.s>0?'--r1':'--line'})"></i>${WS[wday(x.k)]}</div>`).join('');

  }
  let det='';
  if(SD){const dy=S.days[SD]||EMPTY,x=dayScore(dy,S.cfg);
    det=`<div class="card" style="margin-top:12px"><b>${dateLabel(SD)}</b> <span class="pill ${x.score>=50?'g':'m'} num">نمره ${fa(x.score)}٪</span>${dy.rate?` <span class="pill">${RATE[dy.rate-1].e} ${RATE[dy.rate-1].n}</span>`:''}
    <div class="sub2 num" style="margin-top:6px">${fa(x.sd)} از ${fa(x.sv)} قدم · ${fa(x.td)} از ${fa(x.tn)} کار · ${fa(x.bd)} از ${fa(x.bn)} بلوک</div>
    ${dy.line?`<p style="margin:8px 0 0;font-size:13.5px">${esc(dy.line)}</p>`:''}${dy.win?`<p class="sub2" style="margin:4px 0 0">دستاورد: ${esc(dy.win)}</p>`:''}</div>`;}
  /* heatmap, last 100 days, weeks start on Saturday */
  const start=addDays(TK,-99),pre=wday(start),total=pre+100,cols=Math.ceil(total/7);
  let hc='',labels='',lastM=0;
  for(let i=0;i<cols*7;i++){

    else{const dy=S.days[k],sc=dy?dayScore(dy,S.cfg).score:0;hc+=`<i class="l${heatLv(sc,!!dy&&sc>0)}" title="${dateLabel(k)}: ${fa(sc)}٪"></i>`;}
  }
  for(let c=0;c<cols;c++){const k=addDays(start,Math.max(0,c*7-pre)),m=parseKey(k)[1];if(m!==lastM){labels+=`<span style="grid-column:${c+1}">${MONTHS[m-1]}</span>`;lastM=m;}}

  return `

/* ---------- header, clock ---------- */
function clockSvg(){
  let t='';for(let i=0;i<60;i++){const a=i*Math.PI/30,big=i%5===0,r1=big?38:42;
    t+=`<line x1="${(50+Math.sin(a)*r1).toFixed(1)}" y1="${(50-Math.cos(a)*r1).toFixed(1)}" x2="${(50+Math.sin(a)*46).toFixed(1)}" y2="${(50-Math.cos(a)*46).toFixed(1)}" stroke="currentColor" stroke-width="${big?2.4:1}" opacity="${big?0.85:0.3}"/>`;}
  return `<svg id="clock" viewBox="0 0 100 100" role="img" aria-label="ساعت"><circle cx="50" cy="50" r="49" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>${t}
  <line id="hh" x1="50" y1="54" x2="50" y2="29" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
  <line id="mm" x1="50" y1="56" x2="50" y2="17" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <line id="ss" x1="50" y1="60" x2="50" y2="13" stroke="var(--r2)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="3.2" fill="var(--r2)"/></svg>`;
}
function tick(){
  const t=new Date(),s=t.getSeconds(),m=t.getMinutes()+s/60,h=(t.getHours()%12)+m/60;
  const set=(id,a)=>{const e=document.getElementById(id);if(e)e.setAttribute('transform','rotate('+a+' 50 50)');};
  set('hh',h*30);set('mm',m*6);set('ss',s*6);
  const nk=nowKey();if(nk!==TK){const wasPlan=PK===TK;TK=nk;if(wasPlan)PK=TK;render();updHead();}
}
function updHead(){
  const [y,m,d]=parseKey(TK);
  $('#hd-d').textContent=WD[wday(TK)]+' '+fa(d)+' '+MONTHS[m-1];
  $('#hd-s').innerHTML=fa(y)+' · <bdi dir="ltr">'+gregOf(TK)+'</bdi>';
}

/* ---------- actions ---------- */
const A={
  tab(el){tab=el.dataset.t;if(tab==='plan')PK=TK;render();window.scrollTo(0,0);},
  step(el){const d=D(TK),id=el.dataset.id,i=d.done.indexOf(id);if(i<0)d.done.push(id);else d.done.splice(i,1);d.auto[id]=1;touch(TK);render();},
  qual(el){const d=D(TK),id=el.dataset.id,i=d.sel.indexOf(id);if(i<0)d.sel.push(id);else d.sel.splice(i,1);touch(TK);autoTick();render();},
  rate(el){const d=D(TK),v=+el.dataset.v;d.rate=d.rate===v?0:v;touch(TK);render();},
  carry(){const yk=addDays(TK,-1),y=S.days[yk];if(!y)return;y.tasks.filter(t=>!t.done&&!t.moved).forEach(t=>moveTask(yk,t.id,TK));render();toast('کارهای دیروز به امروز منتقل شد');},
  goplan(){tab='plan';PK=TK;render();window.scrollTo(0,0);},
  pday(el){PK=addDays(PK,+el.dataset.n);render();},
  ptoday(){PK=TK;render();},
  bdone(el){const b=D(PK).blocks.find(x=>x.id===el.dataset.id);if(b){b.done=!b.done;touch(PK);render();}},
  badd(){openBlock(null);},
  bedit(el){openBlock(el.dataset.id);},
  bcat(el){SH.c=el.dataset.id;document.querySelectorAll('#pn [data-a=bcat]').forEach(b=>b.classList.toggle('on',b===el));},
  bsave(){
    const t=$('#sb-t').value.trim(),s=$('#sb-s').value,e=$('#sb-e').value;
    if(!t||!s||!e){toast('عنوان و زمان‌ها را کامل کن');return;}
    if(tmin(e)<=tmin(s)){toast('پایان باید بعد از شروع باشد');return;}
    const d=D(PK);
    if(SH.id){const b=d.blocks.find(x=>x.id===SH.id);if(b)Object.assign(b,{t,s,e,c:SH.c});}else d.blocks.push({id:uid(),t,s,e,c:SH.c,done:false});
    touch(PK);closeSheet();render();
  },
  bdel(){const d=D(PK);d.blocks=d.blocks.filter(b=>b.id!==SH.id);touch(PK);closeSheet();render();},
  tpl(){const d=D(PK);S.cfg.tpl.forEach(b=>d.blocks.push({id:uid(),t:b.t,s:b.s,e:b.e,c:b.c,done:false}));touch(PK);render();},
  savetpl(){const d=dd(PK);if(!d.blocks.length)return;S.cfg.tpl=[...d.blocks].sort((a,b)=>tmin(a.s)-tmin(b.s)).map(b=>({s:b.s,e:b.e,t:b.t,c:b.c}));saveCfg();toast('قالب جدید ذخیره شد');render();},
  tpldef(){S.cfg.tpl=defCfg().tpl;saveCfg();toast('قالب پیشنهادی برگشت');render();},
  tadd(){const i=$('#nt'),t=i.value.trim();if(!t)return;D(PK).tasks.push({id:uid(),t,done:false});touch(PK);render();const n=$('#nt');if(n)n.focus();},
  tdone(el){const t=D(PK).tasks.find(x=>x.id===el.dataset.id);if(t){t.done=!t.done;touch(PK);render();}},
  tmove(el){moveTask(PK,el.dataset.id,addDays(PK,1));render();toast('به '+dateLabel(addDays(PK,1))+' منتقل شد');},
  tdel(el){const d=D(PK);d.tasks=d.tasks.filter(x=>x.id!==el.dataset.id);touch(PK);render();},
  gy(el){GY=Math.max(1300,Math.min(1600,GY+ +el.dataset.n));openGoal=null;render();},
  gopen(el){openGoal=openGoal===el.dataset.id?null:el.dataset.id;render();},
  gnew(){openGoalSheet(null);},
  gedit(el){openGoalSheet(el.dataset.id);},
  gdel(el){S.goals=G().filter(g=>g.id!==el.dataset.id);saveGoals();render();},
  adone(el){gmod(el.dataset.g,g=>{const a=g.actions.find(x=>x.id===el.dataset.id);if(a)a.done=!a.done;});},
  adel(el){gmod(el.dataset.g,g=>{g.actions=g.actions.filter(x=>x.id!==el.dataset.id);});},
  aadd(el){const i=$('#na-'+el.dataset.id),t=i.value.trim();if(!t)return;gmod(el.dataset.id,g=>{g.actions.push({id:uid(),t,done:false});});},
  eadd(el){const v=num(en($('#ev-'+el.dataset.id).value)),n=$('#en-'+el.dataset.id).value.trim();if(!v){toast('مقدار تلاش را بنویس');return;}gmod(el.dataset.id,g=>{g.efforts.push({id:uid(),d:TK,v,n});});},
  edel(el){gmod(el.dataset.g,g=>{g.efforts=g.efforts.filter(x=>x.id!==el.dataset.id);});},
  mset(el){const raw=en($('#mv-'+el.dataset.id).value);if(raw===''||!isFinite(parseFloat(raw))){toast('یک عدد وارد کن');return;}const v=parseFloat(raw);gmod(el.dataset.id,g=>{g.metric.cur=v;g.metric.log=(g.metric.log||[]).filter(x=>x.d!==TK);g.metric.log.push({d:TK,v});});},
  ghab(el){el.classList.toggle('on');},
  gm(el){const on=el.classList.toggle('on');$('#'+el.dataset.t).hidden=!on;},
  gsave(){saveGoalSheet();},
  cm(el){CM+=+el.dataset.n;if(CM>12){CM=1;CY++;}if(CM<1){CM=12;CY--;}SD=null;render();},
  cday(el){SD=SD===el.dataset.k?null:el.dataset.k;render();},
  sadd(el){const w=el.dataset.w;if(w==='steps')S.cfg.steps.push({id:'s'+uid(),e:'⭐',t:'قدم تازه'});else S.cfg.qual.push({id:'q'+uid(),e:'⭐',t:'ویژگی تازه',d:'توضیح کوتاه'});saveCfg();render();},
  sdel(el){const w=el.dataset.w;S.cfg[w]=S.cfg[w].filter(x=>x.id!==el.dataset.id);saveCfg();render();},
  smove(el){const l=S.cfg[el.dataset.w],i=l.findIndex(x=>x.id===el.dataset.id);if(i>0){[l[i-1],l[i]]=[l[i],l[i-1]];saveCfg();render();}},
  bkcopy(){
    const txt=JSON.stringify({v:1,cfg:S.cfg,goals:G(),days:S.days});
    const fb=()=>{const t=$('#bk');t.value=txt;t.focus();t.select();toast('متن را کپی کن و جایی نگه دار');};
    try{navigator.clipboard.writeText(txt).then(()=>toast('پشتیبان کپی شد'),fb);}catch(e){fb();}
  },
  bkrestore(){
    try{
      const o=JSON.parse($('#bk').value);if(!o||typeof o.days!=='object')throw new Error('x');
      if(o.cfg)S.cfg=normCfg(o.cfg);if(o.goals)S.goals=normGoals(o.goals);
      S.days={};Object.keys(o.days).forEach(k=>{S.days[k]=normDay(o.days[k]);persist('d-'+k);});
      saveCfg();saveGoals();render();toast('پشتیبان بازیابی شد');
    }catch(e){toast('متن پشتیبان معتبر نیست');}
  },
  async wipe(){
    const ids=['cfg','goals',...Object.keys(S.days).map(k=>'d-'+k)];
    S.cfg=defCfg();S.goals=null;S.days={};dirty.clear();
    ids.forEach(id=>{try{localStorage.removeItem(LS+id);}catch(e){}});
    render();toast('همه‌ی داده‌ها حذف شد');
    if(dbc){for(const id of ids){try{await dbc.doc(id).delete();delete last[id];}catch(e){}}}
  },
  sclose(){closeSheet();}
};
function gmod(id,fn){const g=G().find(x=>x.id===id);if(!g)return;fn(g);g.sample=false;saveGoals();render();}
const CH={
  stepE(t){const s=S.cfg.steps.find(x=>x.id===t.dataset.id);if(s){s.e=t.value.trim()||'⭐';saveCfg();}},
  stepT(t){const s=S.cfg.steps.find(x=>x.id===t.dataset.id);if(s){s.t=t.value.trim()||s.t;saveCfg();}},
  qE(t){const q=S.cfg.qual.find(x=>x.id===t.dataset.id);if(q){q.e=t.value.trim()||'⭐';saveCfg();}},
  qT(t){const q=S.cfg.qual.find(x=>x.id===t.dataset.id);if(q){q.t=t.value.trim()||q.t;saveCfg();}},
  qD(t){const q=S.cfg.qual.find(x=>x.id===t.dataset.id);if(q){q.d=t.value.trim();saveCfg();}},
  first(t){
    const v=t.value.trim(),tm=addDays(TK,1),td=D(tm),i=td.tasks.findIndex(x=>x.id==='first');
    if(v){if(i>=0)td.tasks[i].t=v;else td.tasks.unshift({id:'first',t:v,done:false,from:TK});toast('به کارهای فردا اضافه شد');}
    else if(i>=0&&!td.tasks[i].done)td.tasks.splice(i,1);
    touch(tm);
  }
};

  SH={id:id||null,c:b?b.c:'focus'};
  const s=b?b.s:(lastB?lastB.e:'09:00'),e=b?b.e:addMin(s,60);

   `<label class="lb" for="sb-t">عنوان</label><input id="sb-t" class="in" value="${esc(b?b.t:'')}" placeholder="مثلاً: کار عمیق روی پروژه">

}

    <div id="gs-eb" ${e?'':'hidden'}><div class="two"><div><label class="lb" for="gs-eu">واحد تلاش</label><input id="gs-eu" class="in" value="${esc(e?e.unit:'')}" placeholder="ساعت"></div><div><label class="lb" for="gs-et">هدف تلاش سالانه</label><input id="gs-et" class="in" inputmode="decimal" value="${e?fx(num(e.target)):''}" placeholder="۱۰۰"></div></div>
      <label class="lb" for="gs-ep">هر بار انجام عادت‌های مرتبط چند واحد حساب شود؟</label><input id="gs-ep" class="in" inputmode="decimal" value="${e?fx(num(e.per)||1):'۱'}">
      <label class="lb">عادت‌های مرتبط (قدم‌های صبحگاهی)</label><div class="chips">${S.cfg.steps.map(s=>`<button class="chip ${hab.includes(s.id)?'on':''}" data-a="ghab" data-id="${s.id}">${esc(s.e)} ${esc(s.t)}</button>`).join('')}</div></div>`,
   `<button class="btn" data-a="gsave">ذخیره</button><button class="btn ghost" data-a="sclose">انصراف</button>`);
}
function saveGoalSheet(){
  const t=$('#gs-t').value.trim(),y=parseInt(en($('#gs-y').value),10);
  if(!t){toast('عنوان هدف را بنویس');return;}
  if(!(y>=1300&&y<=1600)){toast('سال را درست وارد کن، مثل ۱۴۰۵');return;}
  const old=SH.id?G().find(x=>x.id===SH.id):null;
  let metric=null,effort=null;
  if(!$('#gs-mb').hidden){
    const name=$('#gs-mn').value.trim(),unit=$('#gs-mu').value.trim(),st=en($('#gs-ms').value),tg=en($('#gs-mt').value);
    if(!name||st===''||tg===''||!isFinite(parseFloat(st))||!isFinite(parseFloat(tg))){toast('نام، شروع و هدف معیار را کامل کن');return;}
    if(parseFloat(st)===parseFloat(tg)){toast('مقدار شروع و هدف نباید برابر باشد');return;}
    const keep=old&&old.metric;
    metric={name,unit,start:parseFloat(st),target:parseFloat(tg),cur:keep?num(keep.cur):parseFloat(st),log:keep?keep.log||[]:[]};
    if(keep&&num(keep.start)!==parseFloat(st)&&!(metric.log||[]).length)metric.cur=parseFloat(st);
  }
  if(!$('#gs-eb').hidden){
    const unit=$('#gs-eu').value.trim(),tg=num(en($('#gs-et').value)),per=num(en($('#gs-ep').value))||1;
    if(!unit||tg<=0){toast('واحد و هدف تلاش را وارد کن');return;}
    effort={unit,target:tg,per};
  }
  const habits=[...document.querySelectorAll('#pn [data-a=ghab].on')].map(b=>b.dataset.id);
  if(old){Object.assign(old,{t,y,metric,effort,habits:effort?habits:[],sample:false});}
  else G().push({id:uid(),t,y,sample:false,metric,effort,actions:[],efforts:[],habits:effort?habits:[]});
  GY=y;saveGoals();closeSheet();render();
}

const armed=new WeakMap();
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const f=A[el.dataset.a];if(!f)return;
  if(el.dataset.k&&!el.classList.contains('arm')){
    el.classList.add('arm');const html=el.innerHTML;armed.set(el,html);
    if(el.classList.contains('ib'))el.setAttribute('aria-label','تأیید حذف');else el.textContent='تأیید؟';
    setTimeout(()=>{if(el.isConnected&&armed.has(el)){el.classList.remove('arm');el.innerHTML=armed.get(el);armed.delete(el);}},3000);
    return;
  }
  f(el,e);
});
document.addEventListener('input',e=>{

});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset&&t.dataset.c;if(c&&CH[c])CH[c](t);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nt'){e.preventDefault();A.tadd();}});
